name: Bug report
description: Report a HyprSpace problem
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include expected and actual behavior.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: HyprSpace and macOS versions
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Relevant config and diagnostics
      description: Include failing shortcuts or window details; remove private information.
